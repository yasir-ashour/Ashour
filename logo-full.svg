<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- تدرج ذهبي فاخر -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="25%" stop-color="#F0D77B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#B89528"/>
      <stop offset="100%" stop-color="#8B6A0F"/>
    </linearGradient>
    
    <!-- تدرج ذهبي لامع للنص الرئيسي -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE08F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B89528"/>
    </linearGradient>
    
    <!-- تدرج أزرق للأزرار -->
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    
    <!-- ظل خفيف للنص -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- خط علوي ذهبي رفيع -->
  <rect x="80" y="40" width="740" height="2" fill="url(#gold)" opacity="0.6"/>
  
  <!-- النقاط الجانبية على الخط العلوي -->
  <circle cx="80" cy="41" r="4" fill="url(#gold)"/>
  <circle cx="820" cy="41" r="4" fill="url(#gold)"/>
  
  <!-- رمز الشعار: خطان متقاطعان (رمز التجارة) -->
  <g transform="translate(450 90)">
    <path d="M -25,0 L 0,-18 L 25,0" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -25,8 L 0,26 L 25,8" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
  
  <!-- الكلمة الرئيسية: مركز عاشور -->
  <text x="450" y="175" text-anchor="middle" 
        font-family="'Amiri', 'Traditional Arabic', serif" 
        font-size="92" font-weight="700" 
        fill="url(#goldText)" 
        filter="url(#softShadow)"
        letter-spacing="2">
    مــركــز عــاشــور
  </text>
  
  <!-- خط فاصل مزخرف -->
  <g transform="translate(450 205)">
    <line x1="-280" y1="0" x2="-60" y2="0" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    <circle cx="-50" cy="0" r="3" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="5" fill="url(#gold)"/>
    <circle cx="50" cy="0" r="3" fill="url(#gold)"/>
    <line x1="60" y1="0" x2="280" y2="0" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- الكلمة الثانوية: للتجارة -->
  <text x="450" y="260" text-anchor="middle" 
        font-family="'Tajawal', 'Amiri', sans-serif" 
        font-size="42" font-weight="500" 
        fill="#FFFFFF" 
        letter-spacing="14"
        opacity="0.95">
    لـلـتـجـارة
  </text>
  
  <!-- خط سفلي ذهبي رفيع -->
  <rect x="80" y="285" width="740" height="2" fill="url(#gold)" opacity="0.6"/>
  
  <!-- نقاط جانبية سفلية -->
  <circle cx="80" cy="286" r="4" fill="url(#gold)"/>
  <circle cx="820" cy="286" r="4" fill="url(#gold)"/>
</svg>
