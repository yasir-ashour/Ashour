<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار - مركز عاشور</title>
<style>
body { font-family: Tahoma, sans-serif; background: #0b0f19; color: white; padding: 20px; }
.status { padding: 20px; margin: 10px 0; border-radius: 10px; font-size: 18px; }
.ok { background: #065f46; border: 2px solid #10b981; }
.err { background: #7f1d1d; border: 2px solid #ef4444; }
.info { background: #1e293b; border: 2px solid #475569; }
button { background: #d4af37; color: #000; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin: 10px 0; }
.prod { background: #1e293b; padding: 15px; margin: 10px 0; border-radius: 10px; }
</style>
</head>
<body>

<h1 style="color: #d4af37;">🔍 اختبار تحميل catalog-data.js</h1>

<div id="log" class="info">جاري الفحص...</div>

<div id="productsList"></div>

<script>
var log = document.getElementById('log');

function show(msg, type) {
  log.className = 'status ' + type;
  log.innerHTML = msg;
}

// محاولة تحميل catalog-data.js
var s = document.createElement('script');
s.src = 'catalog-data.js?v=' + Date.now();

s.onload = function() {
  if (typeof window.catalogData === 'undefined') {
    show('❌ المشكلة: الملف حُمّل، لكن window.catalogData غير موجود!<br>الملف لا يحتوي على بيانات صحيحة.', 'err');
    return;
  }
  
  if (!window.catalogData.products) {
    show('❌ المشكلة: window.catalogData موجود، لكن products غير موجودة!', 'err');
    return;
  }
  
  if (!Array.isArray(window.catalogData.products)) {
    show('❌ المشكلة: products ليست مصفوفة!', 'err');
    return;
  }
  
  var count = window.catalogData.products.length;
  
  if (count === 0) {
    show('⚠️ الملف حُمّل بنجاح، لكن قائمة المنتجات فارغة!', 'err');
    return;
  }
  
  show('✅ نجح التحميل!<br><br>عدد المنتجات: <b>' + count + '</b><br>عدد الفئات: <b>' + (window.catalogData.categories ? window.catalogData.categories.length : 0) + '</b>', 'ok');
  
  // عرض أول 5 منتجات
  var list = document.getElementById('productsList');
  var html = '<h3 style="color:#d4af37;">أول 5 منتجات:</h3>';
  for (var i = 0; i < Math.min(5, count); i++) {
    var p = window.catalogData.products[i];
    html += '<div class="prod"><b>' + (p.name || 'بدون اسم') + '</b><br>';
    html += 'الفئة: ' + (p.category || 'بدون') + '<br>';
    html += 'السعر: ' + (p.price || 'بدون') + '<br>';
    html += 'الصورة: ' + (p.image ? 'موجودة ✓' : 'مفقودة ✗') + '</div>';
  }
  list.innerHTML = html;
};

s.onerror = function() {
  show('❌ فشل تحميل catalog-data.js<br><br>السبب المحتمل:<br>1. الملف غير موجود<br>2. الاسم خاطئ<br>3. لا يوجد اتصال', 'err');
};

document.head.appendChild(s);
</script>

</body>
</html>
