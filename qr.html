<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code - مركز عاشور للتجارة</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Tajawal', sans-serif;
    background: linear-gradient(135deg, #0b0f19 0%, #0f172a 50%, #070a12 100%);
    min-height: 100vh;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container { max-width: 560px; width: 100%; text-align: center; }
  
  .card {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid rgba(212, 175, 55, 0.4);
    border-radius: 28px;
    padding: 30px 24px;
    box-shadow: 0 25px 60px -15px rgba(212, 175, 55, 0.25);
    position: relative;
    overflow: hidden;
  }
  
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #d4af37, #fce08f, #d4af37, #997415);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  
  .logo-wrapper {
    width: 110px;
    height: 110px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logoGlow 2.5s ease-in-out infinite;
  }
  
  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5)); }
    50% { filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.9)); }
  }
  
  .logo-wrapper img { width: 100%; height: 100%; object-fit: contain; }
  
  h1 {
    font-family: 'Amiri', serif;
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #fce08f 0%, #d4af37 50%, #997415 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  
  .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; letter-spacing: 2px; }
  
  .qr-wrapper {
    background: #ffffff;
    padding: 20px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  }
  
  .qr-wrapper img { display: block; width: 280px; height: 280px; border-radius: 12px; }
  
  .qr-hint { font-size: 15px; font-weight: 700; color: #d4af37; margin-bottom: 6px; }
  .qr-hint-small { font-size: 12px; color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
  
  .url-box {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  
  .url-box i { color: #d4af37; font-size: 16px; }
  .url-box code {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    color: #cbd5e1;
    direction: ltr;
    word-break: break-all;
    flex: 1;
    text-align: center;
  }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #d4af37 0%, #b89528 100%);
    color: #0b0f19;
    box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
  }
  
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(212, 175, 55, 0.55); }
  
  .btn-secondary {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #e2e8f0;
  }
  
  .btn-secondary:hover { background: rgba(30, 41, 59, 1); border-color: rgba(212, 175, 55, 0.6); }
  
  .btn-wa {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #ffffff;
    grid-column: 1 / -1;
    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
  }
  
  .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(16, 185, 129, 0.55); }
  .btn i { font-size: 16px; }
  
  .back-link {
    color: #94a3b8;
    text-decoration: none;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 10px;
    transition: all 0.3s ease;
  }
  
  .back-link:hover { color: #d4af37; background: rgba(212, 175, 55, 0.1); }
  
  .footer-text { margin-top: 20px; font-size: 11px; color: #64748b; letter-spacing: 1px; }
  
  @media print {
    body { background: #ffffff; color: #000000; padding: 0; }
    .actions, .back-link, .footer-text, .url-box { display: none !important; }
    .card { background: #ffffff; border: 1px solid #d4af37; box-shadow: none; }
    .card::before { animation: none; background: #d4af37; }
    h1 { -webkit-text-fill-color: #0f172a; color: #0f172a; }
    .subtitle, .qr-hint-small { color: #64748b; }
    .qr-hint { color: #d4af37; }
    .logo-wrapper { animation: none; }
  }
  
  @media (max-width: 480px) {
    .qr-wrapper img { width: 240px; height: 240px; }
    h1 { font-size: 26px; }
    .actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <div class="logo-wrapper">
      <img src="logo.png" alt="مركز عاشور للتجارة">
    </div>
    
    <h1>مركز عاشور للتجارة</h1>
    <p class="subtitle">امسح الرمز — تصفّح واطلب</p>
    
    <div class="qr-wrapper">
      <img id="qrImage" 
           src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2Fyasir-ashour.github.io%2FAshour%2F&color=0b0f19&bgcolor=ffffff&margin=0&qzone=2" 
           alt="QR Code - مركز عاشور">
    </div>
    
    <p class="qr-hint">
      <i class="fas fa-camera"></i> امسح بالكاميرا
    </p>
    <p class="qr-hint-small">
      وجّه كاميرا جوالك نحو الرمز<br>
      لتصفح منتجاتنا وطلبها مباشرة
    </p>
    
    <div class="url-box">
      <i class="fas fa-link"></i>
      <code>yasir-ashour.github.io/Ashour/</code>
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" onclick="downloadQR()">
        <i class="fas fa-download"></i>
        <span>تنزيل الصورة</span>
      </button>
      <button class="btn btn-secondary" onclick="printQR()">
        <i class="fas fa-print"></i>
        <span>طباعة</span>
      </button>
      <a href="https://wa.me/963959248901?text=%D8%B1%D8%A7%D8%A8%D8%B7%20%D9%85%D8%AA%D8%AC%D8%B1%20%D9%85%D8%B1%D9%83%D8%B2%20%D8%B9%D8%A7%D8%B4%D9%88%D8%B1%3A%20https%3A%2F%2Fyasir-ashour.github.io%2FAshour%2F" 
         target="_blank" 
         class="btn btn-wa">
        <i class="fab fa-whatsapp"></i>
        <span>مشاركة الرابط على واتساب</span>
      </a>
    </div>
    
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-right"></i>
      العودة للكتالوج
    </a>
    
    <p class="footer-text">
      <i class="fas fa-shield-alt"></i> جميع الحقوق محفوظة © 2026
    </p>
  </div>
</div>

<script>
  async function downloadQR() {
    const img = document.getElementById('qrImage');
    try {
      const response = await fetch(img.src);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Ashour-QR-Code.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (err) {
      window.open(img.src, '_blank');
    }
  }
  
  function printQR() {
    window.print();
  }
</script>

</body>
</html>
